<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anmnv</title>
  <link rel="stylesheet" href="assets/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Sawarabi+Gothic&display=swap" rel="stylesheet">
</head>
<body>

    <div class="parallax">
        
        <!-- SECTION 1: HERO -->
        <section class="parallax__header" id="hero-section">
            <div class="parallax__visuals">
                <div data-parallax-layers class="parallax__layers">
                    <!-- 1. Фоновое небо -->
                    <img src="assets/imgs/Section_1/background.f8e0a3e86fb4252623af.png" loading="eager" data-parallax-layer="1" alt="" class="parallax__layer-img layer-sky">
                    
                    <!-- 2. СТЕКЛЯННЫЙ ТЕКСТ-ОПТИЧЕСКАЯ ЛИНЗА (ЗА ГОРАМИ) -->
                    <div data-parallax-layer="title" class="parallax__layer-title">
                        <h1 class="parallax__title" data-text="anmnv">anmnv</h1>
                    </div>
                    
                    <!-- 3. Горы (перекрывают преломляющее стекло) -->
                    <img src="assets/imgs/Section_1/mountains.png" loading="eager" data-parallax-layer="2" alt="" class="parallax__layer-img layer-mountains">
                    
                    <!-- Джунгли -->
                    <img src="assets/imgs/Section_1/logo_land.png" loading="eager" data-parallax-layer="3" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/jungle1.png" loading="lazy" data-parallax-layer="4" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/jungle2.png" loading="lazy" data-parallax-layer="5" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/jungle3.png" loading="lazy" data-parallax-layer="6" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/jungle4.png" loading="lazy" data-parallax-layer="7" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/jungle5.png" loading="lazy" data-parallax-layer="8" alt="" class="parallax__layer-img">
                    <img src="assets/imgs/Section_1/man_on_mountain.png" loading="lazy" data-parallax-layer="9" alt="" class="parallax__layer-img">
                </div>
            </div>
            <div class="parallax__fade"></div>
            <div class="scroll-chevron-container">
                <div class="chevron"></div>
                <div class="chevron"></div>
                <div class="chevron"></div>
            </div>
        </section> 

        <!-- SECTION 2: SKILLS -->
        <section class="parallax__header" id="skills-section">
            <canvas id="matrixCanvas" class="matrix-canvas"></canvas>
            
            <div class="parallax__visuals">
                <div class="parallax__fade_rev"></div>
                <div class="parallax__fade"></div>
            </div>

            <div class="section-overlay-content">
                <div class="frosted-container">
                  <div class="frosted-glass">
                    <div class="text">Programming Languages</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=python" alt="Python" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=c" alt="C" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=cpp" alt="C++" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=cs" alt="C#" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=go" alt="Go" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=rust" alt="Rust" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=haskell" alt="Haskell" loading="lazy" />
                    </div>
                  </div>
          
                  <div class="frosted-glass">
                    <div class="text">Operating Systems</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=windows" alt="Windows" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=linux" alt="Linux" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=debian" alt="Debian" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=kali" alt="Kali" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=arch" alt="Arch" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=arduino" alt="Arduino" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=raspberrypi" alt="Raspberry Pi" loading="lazy" />
                    </div>
                  </div>
          
                  <div class="frosted-glass">
                    <div class="text">Development Tools</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=github" alt="GitHub" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=git" alt="Git" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=vscode" alt="VSCode" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=vscodium" alt="VSCodium" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=sublime" alt="Sublime" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=unity" alt="Unity" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=unreal" alt="Unreal" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=androidstudio" alt="Android Studio" loading="lazy" />
                    </div>
                  </div>
          
                  <div class="frosted-glass">
                    <div class="text">Design & Creative</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=ps" alt="Photoshop" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=ai" alt="Illustrator" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=blender" alt="Blender" loading="lazy" />
                    </div>
                  </div>
          
                  <div class="frosted-glass">
                    <div class="text">Environment</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=bash" alt="Bash" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=latex" alt="LaTeX" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=sqlite" alt="SQLite" loading="lazy" />
                    </div>
                  </div>
          
                  <div class="frosted-glass">
                    <div class="text">Web Stack</div>
                    <div class="skills-container">
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=typescript" alt="TypeScript" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=js" alt="JavaScript" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=html" alt="HTML" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=css" alt="CSS" loading="lazy" />
                      <img src="https://go-skill-icons.vercel.app/api/icons?i=vite" alt="Vite" loading="lazy" />
                    </div>
                  </div>
                </div>
            </div>
        </section>

        <!-- SECTION 3: PROJECTS -->
        <section class="parallax__header section-projects" id="projects-section">
            <div class="parallax__visuals">
                <div data-parallax-layers class="parallax__layers">
                    <img src="assets/imgs/1.jpg" loading="lazy" data-parallax-layer="1" alt="" class="parallax__layer-img">
                </div>
                <div class="parallax__fade_rev"></div>
                <div class="parallax__fade"></div>
            </div>
            
            <div class="section-overlay-content">
                <div class="projects-grid">
                    <div class="repo-card" data-repo="AnMnv/eBook"></div>
                    <div class="repo-card" data-repo="Anmnv/latex-skill-icons"></div>
                    <div class="repo-card" data-repo="Anmnv/python-image-compressor"></div>
                    <div class="repo-card" data-repo="Anmnv/3UnityGames"></div>
                    <div class="repo-card" data-repo="Anmnv/rust-def-bot"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="assets/js/all.js"></script>
</body>
</html>
